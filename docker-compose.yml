version: '3.8'

services:
  gitflow:
    build: .
    container_name: gitflow-web
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # HTTPS Router
      - "traefik.http.routers.gitflow.rule=Host(`gitflow.ramzeta.xyz`)"
      - "traefik.http.routers.gitflow.entrypoints=websecure"
      - "traefik.http.routers.gitflow.tls=true"
      - "traefik.http.routers.gitflow.tls.certresolver=le"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.gitflow-http.rule=Host(`gitflow.ramzeta.xyz`)"
      - "traefik.http.routers.gitflow-http.entrypoints=web"
      - "traefik.http.routers.gitflow-http.middlewares=https-redirect"
      # Service
      - "traefik.http.services.gitflow.loadbalancer.server.port=80"
    networks:
      - web

networks:
  web:
    external: true
